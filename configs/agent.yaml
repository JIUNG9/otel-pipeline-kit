# Agent collector: one per node (DaemonSet). Receives OTLP from workloads on
# the node and forwards to the gateway. Sized for a 512Mi container memory limit.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    # A hostPath mount, so the queue survives a pod reschedule on the same node.
    directory: /var/lib/otelcol/queue
    timeout: 10s
    # Compaction writes a temporary copy to /tmp (mount an emptyDir there; the image has none).
    compaction:
      on_start: true
      directory: /tmp

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    send_batch_size: 2048
    send_batch_max_size: 2048
    timeout: 2s

exporters:
  otlp/gateway:
    endpoint: ${env:GATEWAY_OTLP_ENDPOINT}
    tls:
      insecure: ${env:GATEWAY_OTLP_INSECURE}
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 600s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000
      storage: file_storage/queue

service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    metrics:
      level: detailed
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/gateway]
